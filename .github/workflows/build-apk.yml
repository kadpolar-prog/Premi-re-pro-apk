name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer les fichiers
        uses: actions/checkout@v4

      - name: Decompresser Premiere Pocket
        run: |
          mkdir project
          ZIP=$(find . -maxdepth 1 -name "PremierePocket*.zip" | head -n 1)
          unzip -q "$ZIP" -d project

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Installer Android
        uses: android-actions/setup-android@v3

      - name: Installer Android 35
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Compiler APK
        run: gradle -p project :app:assembleDebug

      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: PremierePocket-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
